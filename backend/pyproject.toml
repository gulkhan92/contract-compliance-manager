[project]
name = "oblitrack-backend"
version = "0.1.0"
description = "ObliTrack — Contract Lifecycle & Obligation Management System (backend API)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole test session: our SQLAlchemy async `engine`
# (app.db.session) is a module-level singleton, and its asyncpg connections
# are bound to whichever loop created them — pytest-asyncio's default
# per-function loop would tear that loop down between tests while the engine
# still held connections opened on it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # autogenerated; long enum/column defs aren't hand-wrapped

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
