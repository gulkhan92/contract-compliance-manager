[project]
name = "oblitrack-backend"
version = "0.1.0"
description = "ObliTrack — Contract Lifecycle & Obligation Management System (backend API)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
