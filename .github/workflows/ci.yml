name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oblitrack
          POSTGRES_PASSWORD: oblitrack
          POSTGRES_DB: oblitrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oblitrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://oblitrack:oblitrack@localhost:5432/oblitrack
      # Phase 4: prefer the plain HTTP download path for the (one-time,
      # then cached) embedding model fetch over huggingface_hub's newer
      # "xet" transfer backend — more reliable on constrained/proxied CI
      # network paths, matching app.services.embeddings' own runtime choice.
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ hashFiles('backend/app/core/config.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app scripts tests

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify no schema drift (models vs. migrations)
        run: alembic check

      - name: Test (pytest)
        run: pytest -q

      - name: Dependency vulnerability scan (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 5's package.json requires node "^22.12.0 || ^24.0.0 ||
          # >=26.0.0" — Node 20 satisfies none of those ranges and fails
          # fast when vitest actually runs. Keep this at 22+ even if it's
          # tempting to "match the Dockerfile" back down to 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-build:
    name: Docker image build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t oblitrack-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t oblitrack-frontend:ci ./frontend
